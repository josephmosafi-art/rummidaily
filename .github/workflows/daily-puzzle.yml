name: Generate Daily RummiDaily Puzzle

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and independently verify tomorrow's puzzle
        run: python generator/generate_daily.py

      - name: Commit generated puzzle
        run: |
          if [ -z "$(git status --porcelain puzzles/)" ]; then
            echo "No puzzle change to commit."
            exit 0
          fi

          git config user.name "RummiDaily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add puzzles/
          git commit -m "Add daily RummiDaily puzzle"
          git push
